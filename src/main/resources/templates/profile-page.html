<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:href="@{/css/profile-page.css}" rel="stylesheet">
    <link th:href="@{/css/header.css}" rel="stylesheet">
    <link th:href="@{/css/footer.css}" rel="stylesheet">
    <title>User Profile - UkrLitExchange"</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>
<div class="content-container">
    <header th:replace="~{fragments/header.html :: header}"></header>

    <main class="profile-main">
        <div class="tab-content">
            <div class="tab-pane fade show active">
                <!-- Profile Header -->
                <section class="profile-header">
                    <div class="profile-avatar">
                        <img th:src="${user.avatarUrl}" alt="User Avatar">
                    </div>

                    <div class="profile-details">
                        <h2 th:text="${user.username}"></h2>
                        <div class="profile-meta">
                            <p class="mb-2">
                                <i class="fas fa-map-marker-alt me-2"></i>
                                <span th:text="${user.location}"></span>
                            </p>
                            <p class="mb-0 text-muted" th:text="${user.bio}"></p>
                        </div>
                    </div>
                </section>

                <!-- Contact Info -->
                <section class="profile-info">
                    <h3>
                        <i class="fas fa-address-card"></i>
                        Contact Details
                    </h3>
                    <ul>
                        <li>
                            <i class="fas fa-user-tag"></i>
                            <span th:text="${user.fullName}"></span>
                        </li>
                        <li>
                            <i class="fas fa-envelope"></i>
                            <a th:href="'mailto:' + ${user.email}"
                               th:text="${user.email}"
                               class="link-accent"></a>
                        </li>
                        <li>
                            <i class="fas fa-phone"></i>
                            <a th:href="'tel:' + ${user.phoneNumber}"
                               th:text="${user.phoneNumber}"
                               class="link-accent"></a>
                        </li>
                    </ul>
                </section>

                <!-- Exchange Statistics -->
                <section class="profile-exchange-stats mt-4">
                    <h3>
                        <i class="fas fa-exchange-alt"></i>
                        Exchange Statistics
                    </h3>
                    <ul class="exchange-stats-list">
                        <li>
                            <i class="fas fa-paper-plane me-2"></i>
                            Sent Requests:
                            <strong th:text="${sendRequests}">0</strong>
                        </li>
                        <li>
                            <i class="fas fa-tasks me-2"></i>
                            All Participated Requests:
                            <strong th:text="${allRequests}">0</strong>
                        </li>
                        <li>
                            <i class="fas fa-check-circle me-2"></i>
                            Completed Exchanges:
                            <strong th:text="${completedExchange}">0</strong>
                        </li>
                    </ul>
                </section>

                <!-- User Reviews -->
                <section class="profile-reviews">
                    <h3>
                        <i class="fas fa-comments"></i>
                        User Reviews
                    </h3>

                    <div th:if="${#lists.isEmpty(reviews)}">
                        <p class="text-muted">No reviews yet.</p>
                    </div>

                    <div th:unless="${#lists.isEmpty(reviews)}"
                         class="d-flex overflow-auto gap-3 py-3"
                         style="scroll-snap-type: x mandatory;">

                        <div th:each="review : ${reviews}"
                             class="review-item card flex-shrink-0 p-3"
                             style="width: 300px; scroll-snap-align: start;">

                            <div class="d-flex justify-content-between mb-2">
                                <div class="rating-stars">
                                    <span th:each="i : ${#numbers.sequence(1, 5)}"
                                          class="star"
                                          th:classappend="${i <= review.rating} ? 'fas fa-star' : 'far fa-star'"></span>
                                </div>
                            </div>

                            <div class="comment">
                                <strong>Comment</strong>
                                <p th:text="${review.comment}"></p>
                            </div>

                            <div class="review-meta">
                                <small class="text-muted">
                                    Reviewed by: <span th:text="${review.reviewer.username}">Reviewer</span>
                                </small>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Edit Button -->
                <div class="profile-actions">
                    <a th:href="@{/web/ukr-lit-exchange/profile/edit}"
                       class="edit-profile-btn">
                        <i class="fas fa-edit"></i>
                        Edit Profile
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{/fragments/footer.html :: footer}"></footer>
</div>
</body>
</html>
